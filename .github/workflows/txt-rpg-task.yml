name: TxtRPG Task → Copilot → Review

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What should Copilot implement?"
        required: true
        type: string
      acceptance:
        description: "Optional acceptance criteria"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  create-task:
    runs-on: ubuntu-latest
    steps:
      - name: Create issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TASK: ${{ inputs.task }}
          ACCEPTANCE: ${{ inputs.acceptance }}
        shell: bash
        run: |
          set -euo pipefail

          acceptance="${ACCEPTANCE:-Define concrete acceptance criteria before implementation and verify them before opening the PR.}"
          body=$(cat <<EOF
          ## Task
          ${TASK}

          ## Acceptance criteria
          ${acceptance}

          ## Implementation rules
          - Inspect the current repository before editing.
          - Make the smallest safe change using the existing architecture.
          - Follow AGENTS.md and the repository's YAGNI/Ponytail principles.
          - Preserve offline-first Edge/Chromium operation.
          - Preserve IndexedDB compatibility and Worker/fallback parity when relevant.
          - Add or update focused regression tests for changed behavior.
          - Run applicable syntax, regression, and browser verification.
          - Create a Pull Request when implementation and verification are complete.
          - Do not merge the Pull Request.

          ## Human boundary
          The repository owner reviews the resulting Pull Request and decides whether to request changes or merge it.
          EOF
          )

          response=$(curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/issues" \
            --data-binary "$(jq -n --arg title "${TASK:0:120}" --arg body "$body" '{title:$title,body:$body}')")

          issue_number=$(jq -r '.number' <<< "$response")
          issue_url=$(jq -r '.html_url' <<< "$response")
          echo "issue_number=${issue_number}" >> "$GITHUB_OUTPUT"
          echo "Created issue #${issue_number}: ${issue_url}"

      - name: Assign Copilot coding agent
        env:
          GH_TOKEN: ${{ secrets.GH_COPILOT_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN}" ]]; then
            echo "GH_COPILOT_TOKEN repository secret is required for Copilot agent assignment." >&2
            exit 1
          fi

          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/issues/${ISSUE_NUMBER}/assignees" \
            --data-binary "$(jq -n --arg repo "$REPO" '{assignees:["copilot-swe-agent[bot]"],agent_assignment:{target_repo:$repo,base_branch:"main",custom_instructions:"Implement only the requested task. Do not merge. Return a reviewable pull request with verification results.",custom_agent:"",model:""}}')"

          echo "Assigned Copilot coding agent to issue #${ISSUE_NUMBER}."
