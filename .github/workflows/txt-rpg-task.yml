name: TxtRPG Task → Issue → Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What should Copilot implement?"
        required: true
        type: string
      agent:
        description: "Custom agent profile to select when assigning the issue"
        required: false
        type: string
        default: "txtrpg-engine"
      acceptance:
        description: "Optional acceptance criteria"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  create-task:
    runs-on: ubuntu-latest
    steps:
      - name: Create issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TASK: ${{ inputs.task }}
          AGENT: ${{ inputs.agent }}
          ACCEPTANCE: ${{ inputs.acceptance }}
        shell: bash
        run: |
          set -euo pipefail

          acceptance="${ACCEPTANCE:-Define concrete acceptance criteria before implementation and verify them before opening the PR.}"
          body=$(cat <<EOF
          ## Objective
          ${TASK}

          ## Suggested Copilot custom agent
          \`${AGENT}\`

          > Assign the issue to Copilot from the GitHub Issue **Assignees** menu and select the suggested custom agent. The custom-agent choice is intentionally made through GitHub's supported agent-assignment UI rather than an undocumented REST payload.

          ## Acceptance criteria
          ${acceptance}

          ## Implementation rules
          - Inspect the current repository, recent commits, relevant docs, and tests before editing.
          - Select the smallest coherent implementation, not necessarily the smallest patch.
          - Larger patches are allowed when they form a coherent playable improvement and are thoroughly verified.
          - Follow AGENTS.md and repository YAGNI/Ponytail principles.
          - Preserve offline-first Edge/Chromium operation.
          - Preserve IndexedDB compatibility and Worker/fallback parity when relevant.
          - Add or update focused regression tests before/alongside behavior changes where practical.
          - Run applicable syntax, focused regression, full regression, and browser verification.
          - Distinguish environment/tooling failures from product defects.
          - If verification fails, diagnose the cause and make bounded corrective attempts.
          - Create a reviewable Pull Request when implementation and verification are complete.
          - Do not claim success from an unverified implementation.
          EOF
          )

          response=$(curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/issues" \
            --data-binary "$(jq -n --arg title "${TASK:0:120}" --arg body "$body" '{title:$title,body:$body}')"

          issue_number=$(jq -r '.number' <<< "$response")
          issue_url=$(jq -r '.html_url' <<< "$response")
          echo "issue_number=${issue_number}" >> "$GITHUB_OUTPUT"
          echo "Created issue #${issue_number}: ${issue_url}"
          echo "Assign Copilot from the issue Assignees menu and choose custom agent: ${AGENT}"
