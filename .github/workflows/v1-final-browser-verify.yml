name: v1-final Browser Verification (manual)

on:
  workflow_dispatch: {}

jobs:
  browser-verify:
    name: Browser verification (phase255 + phase291)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start web server
        shell: bash
        run: |
          set -e
          nohup python3 -m http.server 4173 --directory web >/tmp/txtrpg-http.log 2>&1 &
          echo $! > /tmp/txtrpg-http.pid

      - name: v1-final browser verification
        run: |
          npx playwright test \
            tests/phase255-browser.spec.js \
            tests/phase291-browser-long-play.spec.js \
            --reporter=line,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: error
