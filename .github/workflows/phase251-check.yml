name: TxtRPG Runtime CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit & regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        shell: bash
        run: |
          set -e
          find web -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: V2 core regression
        run: node tests/v2/run.js

      - name: Core regression
        run: node tests/phase251-engineization.js

      - name: NPC tick regression
        run: node tests/phase254-npc-tick.js

      - name: NPC routine cadence regression
        run: node tests/phase256-npc-routine-cadence.js

      - name: NPC event trigger regression
        run: node tests/phase257-npc-event-trigger.js

      - name: Faction world regression
        run: node tests/phase257-faction-world.js

      - name: Worker faction parity regression
        run: node tests/phase259-worker-faction-parity.js

      - name: Economy regression
        run: node tests/phase260-economy.js

      - name: Information regression
        run: node tests/phase261-information.js

      - name: NPC goal regression
        run: node tests/phase262-npc-goals.js

      - name: Organization regression
        run: node tests/phase263-organizations.js
      - name: Goal dynamics regression
        run: node tests/phase264-goal-dynamics.js
      - name: Organization relations regression
        run: node tests/phase265-organization-relations.js
      - name: Organization event bridge regression
        run: node tests/phase266-organization-events.js
      - name: Case consequence regression
        run: node tests/phase267-case-consequences.js
      - name: Economic pressure regression
        run: node tests/phase268-economic-pressure.js
      - name: NPC relations regression
        run: node tests/phase269-npc-relations.js
      - name: Regional economy regression
        run: node tests/phase271-regional-economy-regression.js
      - name: Case causality regression
        run: node tests/phase271-case-causality.js

  browser:
    name: Browser smoke
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.55.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install browser test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start web server
        shell: bash
        run: |
          set -e
          nohup python3 -m http.server 4173 --directory web >/tmp/txtrpg-http.log 2>&1 &
          echo $! > /tmp/txtrpg-http.pid

      - name: Browser smoke regression
        run: npx playwright test tests/phase255-browser.spec.js --reporter=line

      - name: V2 storage browser smoke
        run: npx playwright test tests/v2-storage-browser.spec.js --reporter=line

      - name: V2 world data pack browser smoke
        run: npx playwright test tests/v2-data-world-browser.spec.js --reporter=line

      - name: V2 minimal browser UI smoke
        run: npx playwright test tests/v2-ui-browser.spec.js --reporter=line

      - name: V2 UI lifecycle browser smoke
        run: npx playwright test tests/v2-ui-lifecycle-browser.spec.js --reporter=line

      - name: V2 UI view boundary browser smoke
        run: npx playwright test tests/v2-ui-view-boundary-browser.spec.js --reporter=line

      - name: V2 save compatibility browser smoke
