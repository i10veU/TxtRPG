name: Phase 251 Runtime Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        shell: bash
        run: |
          set -e
          find web -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Core regression
        run: node tests/phase251-engineization.js
