name: TxtRPG AutoDev Merge and Continue

on:
  workflow_run:
    workflows: ["TxtRPG Autonomous Development"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge-and-continue:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check optional campaign deadline
        id: deadline
        env:
          DEADLINE_KST: ${{ vars.TXTRPG_AUTODEV_DEADLINE_KST }}
        shell: bash
        run: |
          if [ -z "$DEADLINE_KST" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "No campaign deadline is configured; continuing."
            exit 0
          fi

          deadline=$(TZ=Asia/Seoul date -d "$DEADLINE_KST" +%s)
          now=$(date +%s)

          if [ "$now" -ge "$deadline" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "TxtRPG autonomous development campaign has reached its configured deadline."
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate cycle trigger token
        if: steps.deadline.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN || secrets.GH_AW_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo 'Missing GH_AW_CI_TRIGGER_TOKEN (or GH_AW_GITHUB_TOKEN) required for autonomous cycle chaining.' >&2
            exit 1
          fi
          gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/txt-rpg-autodev.lock.yml" --jq '.state'

      - name: Find autonomous PR from completed cycle
        if: steps.deadline.outputs.active == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --json number,title,createdAt,headRefName,author | \
            jq -r --arg started "$RUN_STARTED_AT" '
              [.[]
                | select(.createdAt >= $started)
                | select(
                    (.headRefName | startswith("autodev/"))
                    or (.headRefName | startswith("copilot/"))
                    or (.author.login == "Copilot")
                    or (.title | startswith("[TxtRPG AutoDev] "))
                  )
              ]
              | sort_by(.createdAt)
              | last
              | .number // empty')

          if [ -n "$pr" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "number=$pr" >> "$GITHUB_OUTPUT"
            echo "Found autonomous PR #$pr created during this cycle."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No autonomous PR was found for this cycle."
          fi

      - name: Wait for autonomous PR checks
        if: steps.deadline.outputs.active == 'true' && steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for Runtime CI on PR #$PR_NUMBER..."
          for attempt in {1..30}; do
            count=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json statusCheckRollup --jq '.statusCheckRollup | length')
            if [ "$count" -gt 0 ]; then
              echo "Detected $count PR check(s)."
              gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --watch --fail-fast
              exit 0
            fi
            sleep 10
          done

          echo "PR checks did not appear. GitHub marked the pull_request Runtime CI as action_required, so dispatching the same Runtime CI workflow manually on the PR branch as a safe fallback."
          head_ref=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq '.headRefName')
          gh workflow run phase251-check.yml --repo "$GITHUB_REPOSITORY" --ref "$head_ref"

          run_id=""
          for attempt in {1..30}; do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow phase251-check.yml --branch "$head_ref" --limit 5 --json databaseId,status,conclusion,createdAt --jq 'sort_by(.createdAt) | last | .databaseId // empty')
            if [ -n "$run_id" ]; then
              echo "Dispatched Runtime CI run #$run_id on $head_ref."
              break
            fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "Manual Runtime CI dispatch was not observable." >&2
            exit 1
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Merge autonomous PR
        if: steps.deadline.outputs.active == 'true' && steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch

      - name: Check whether main advanced during a PR-less cycle
        if: steps.deadline.outputs.active == 'true' && steps.pr.outputs.found != 'true' && github.event_name == 'workflow_run'
        id: advanced
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CYCLE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha=$(gh api "/repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          if [ "$main_sha" != "$CYCLE_SHA" ]; then
            echo "advanced=true" >> "$GITHUB_OUTPUT"
            echo "main advanced from $CYCLE_SHA to $main_sha; a PR was likely merged elsewhere."
          else
            echo "advanced=false" >> "$GITHUB_OUTPUT"
            echo "main did not advance during this cycle."
          fi

      - name: Start next autonomous cycle after merge
        if: steps.deadline.outputs.active == 'true' && steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN || secrets.GH_AW_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo 'Missing GH_AW_CI_TRIGGER_TOKEN (or GH_AW_GITHUB_TOKEN) required for cross-workflow dispatch.' >&2
            exit 1
          fi
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type='txt-rpg-autodev-next'
          echo 'Next autonomous cycle dispatched after autonomous PR merge.'

      - name: Continue after externally merged autonomous change
        if: steps.deadline.outputs.active == 'true' && steps.pr.outputs.found != 'true' && steps.advanced.outputs.advanced == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN || secrets.GH_AW_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo 'Missing GH_AW_CI_TRIGGER_TOKEN (or GH_AW_GITHUB_TOKEN) required for cross-workflow dispatch.' >&2
            exit 1
          fi
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type='txt-rpg-autodev-next'
          echo 'Next autonomous cycle dispatched because main advanced without an open PR.'

      - name: Report idle cycle
        if: steps.deadline.outputs.active == 'true' && steps.pr.outputs.found != 'true' && steps.advanced.outputs.advanced != 'true'
        run: echo 'No autonomous PR was produced and main did not advance; no next cycle dispatched.'
