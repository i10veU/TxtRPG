name: TxtRPG AutoDev PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  info:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          startsWith(github.event.pull_request.title, '[TxtRPG AutoDev] ') }}
    runs-on: ubuntu-slim
    steps:
      - run: echo "AutoDev PR created. The repository Runtime CI is the verification gate; this workflow performs no merge or chaining."
