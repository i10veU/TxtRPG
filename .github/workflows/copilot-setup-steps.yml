name: Copilot agent setup

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser-test dependency
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium for browser verification
        run: npx playwright install --with-deps chromium
