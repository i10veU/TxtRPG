name: TxtRPG gh-aw Toolchain Upgrade (one-shot v4)

on:
  push:

permissions:
  contents: write
  actions: write

jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[gh-aw-toolchain-upgrade]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install latest gh-aw
        shell: bash
        run: |
          set -euo pipefail
          curl -sL https://raw.githubusercontent.com/github/gh-aw/main/install-gh-aw.sh | bash
          echo "$HOME/.local/share/gh/extensions" >> "$GITHUB_PATH"
          gh aw version

      - name: Upgrade gh-aw repository tooling
        shell: bash
        run: |
          set -euo pipefail
          gh aw upgrade --pre-releases

      - name: Validate and compile Agentic Workflows
        shell: bash
        run: |
          set -euo pipefail
          gh aw compile --validate

      - name: Commit upgraded runtime without setup workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/copilot-setup-steps.yml
          rm -f .github/workflows/txt-rpg-autodev-toolchain-upgrade.yml
          rm -f .github/workflows/txt-rpg-autodev-toolchain-upgrade-v2.yml
          rm -f .github/workflows/txt-rpg-autodev-toolchain-upgrade-v3.yml
          rm -f .github/workflows/txt-rpg-autodev-toolchain-upgrade-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github .gitattributes
          git status --short
          if git diff --cached --quiet; then
            echo "No repository changes detected after upgrade."
            exit 0
          fi
          git commit -m "[gh-aw-toolchain-upgrade] Upgrade Agentic Workflow runtime"
          git push

      - name: Start TxtRPG AutoDev
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type='txt-rpg-autodev-next'
