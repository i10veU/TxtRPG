name: Compile TxtRPG Autonomous Workflow

on:
  push:
    paths:
      - '.github/workflows/txt-rpg-autodev.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_AW_GITHUB_TOKEN }}
          persist-credentials: true

      - name: Install gh-aw
        shell: bash
        run: |
          set -euo pipefail
          curl -sL https://raw.githubusercontent.com/github/gh-aw/main/install-gh-aw.sh | bash
          echo "$HOME/.local/share/gh/extensions" >> "$GITHUB_PATH"
          gh aw version

      - name: Compile workflow
        shell: bash
        run: |
          set -euo pipefail
          gh aw compile --validate

      - name: Commit generated workflow
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/txt-rpg-autodev.lock.yml .github/aw/actions-lock.json .github/agents/agentic-workflows.md .github/skills/agentic-workflows/SKILL.md .gitattributes; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/txt-rpg-autodev.lock.yml .github/aw/actions-lock.json .github/agents/agentic-workflows.md .github/skills/agentic-workflows/SKILL.md .gitattributes
          git commit -m 'chore: compile autonomous workflow'
          git push
