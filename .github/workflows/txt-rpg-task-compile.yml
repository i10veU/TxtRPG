name: Compile TxtRPG Task Workflow

on:
  push:
    paths:
      - '.github/workflows/txt-rpg-task.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_AW_GITHUB_TOKEN }}
          persist-credentials: true

      - name: Install gh-aw
        shell: bash
        run: |
          set -euo pipefail
          curl -sL https://raw.githubusercontent.com/github/gh-aw/main/install-gh-aw.sh | bash
          echo "$HOME/.local/share/gh/extensions" >> "$GITHUB_PATH"
          gh aw version

      - name: Compile task workflow
        shell: bash
        run: |
          set -euo pipefail
          gh aw compile .github/workflows/txt-rpg-task.md --validate

      - name: Commit generated lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/txt-rpg-task.lock.yml; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/txt-rpg-task.lock.yml
          git commit -m 'chore: compile reviewed task workflow'
          git push
