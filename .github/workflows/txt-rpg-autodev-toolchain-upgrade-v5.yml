name: TxtRPG gh-aw Upgrade Artifact (one-shot v5)

on:
  push:
    paths:
      - '.github/workflows/txt-rpg-autodev-toolchain-upgrade-v5.yml'

permissions:
  contents: read

jobs:
  upgrade-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install latest gh-aw
        shell: bash
        run: |
          set -euo pipefail
          curl -sL https://raw.githubusercontent.com/github/gh-aw/main/install-gh-aw.sh | bash
          echo "$HOME/.local/share/gh/extensions" >> "$GITHUB_PATH"
          gh aw version

      - name: Upgrade and compile
        shell: bash
        run: |
          set -euo pipefail
          gh aw upgrade --pre-releases
          gh aw compile --validate
          echo '--- git status ---'
          git status --short

      - name: Upload upgraded Agentic Workflow files
        uses: actions/upload-artifact@v4
        with:
          name: txtrpg-gh-aw-upgrade
          if-no-files-found: error
          path: |
            .gitattributes
            .github/agents/agentic-workflows.md
            .github/aw/actions-lock.json
            .github/skills/agentic-workflows/SKILL.md
            .github/workflows/txt-rpg-autodev.md
            .github/workflows/txt-rpg-autodev.lock.yml
