<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>무명의 연대기 — TXT RPG</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="desktop-stage">
  <section class="game" aria-label="무명의 연대기 게임 화면">
    <header class="topbar">
      <span id="location">세르카 · 북문 시장</span>
      <span id="timeText">06:00</span>
    </header>

    <section class="story">
      <div id="dateText" class="date-text"></div>
      <div id="storyBody" class="story__body" aria-live="polite"></div>
    </section>

    <section class="hud">
      <div class="hud__stats">
        <span>HP <b id="hpText">10/10</b></span>
        <span>F <b id="fatigueText">2/10</b></span>
        <span>G <b id="moneyText">18</b></span>
      </div>
      <form id="actionForm" class="action">
        <span>&gt;</span>
        <input id="actionInput" autocomplete="off" maxlength="300" placeholder="명령" aria-label="게임 명령">
        <button type="submit" aria-label="실행">↵</button>
      </form>
    </section>

    <aside class="overlay" aria-hidden="true">
      <div class="overlay__head">
        <span id="overlayTitle">STATUS</span>
        <button id="overlayClose" type="button">×</button>
      </div>

      <section class="overlay__panel" data-panel="status">
        <div class="mini-grid">
          <span>DAY</span><b id="overlayDay">1</b>
          <span>TIME</span><b id="overlayTime">06:00</b>
          <span>HP</span><b id="overlayHp">10/10</b>
          <span>FATIGUE</span><b id="overlayFatigue">2/10</b>
          <span>GOLD</span><b id="overlayMoney">18</b>
          <span>GRAIN</span><b id="overlayGrain">10G</b>
          <span>STOCK</span><b id="overlayGrainStock">24</b>
        </div>
      </section>

      <section class="overlay__panel" data-panel="inventory">
        <ul id="inventoryList" class="compact-list"></ul>
      </section>

      <section class="overlay__panel" data-panel="npc">
        <ul id="npcList" class="compact-list"></ul>
      </section>

      <section class="overlay__panel" data-panel="faction">
        <ul id="relationList" class="compact-list"></ul>
      </section>

      <section class="overlay__panel" data-panel="cases">
        <ul id="knownList" class="compact-list"></ul>
      </section>

      <section class="overlay__panel" data-panel="rumors">
        <ul id="rumorList" class="compact-list"></ul>
      </section>

      <section class="overlay__panel" data-panel="organizations">
        <ul id="organizationList" class="compact-list"></ul>
      </section>

      <div class="overlay__help">1 상태 · 2 소지품 · 3 인물 · 4 세력 · 5 사건 · 6 소문 · 7 조직 · ESC 닫기</div>
    </aside>
  </section>
</main>

<script src="core/game-state.js" defer></script>
<script src="data/places.js" defer></script>
<script src="data/npcs.js" defer></script>
<script src="data/cases.js" defer></script>
<script src="core/economy-world.js" defer></script>
<script src="core/faction-world.js" defer></script>
<script src="core/action-resolver.js" defer></script>
<script src="core/npc-simulation.js" defer></script>
<script src="storage/idb-storage.js" defer></script>
<script src="ui/renderer.js" defer></script>
<script src="ui/input.js" defer></script>
<script src="game.js" defer></script>
</body>
</html>
