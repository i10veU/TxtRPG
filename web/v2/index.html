<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>무명의 연대기</title>
<link rel="icon" href="data:,">
<style>
  /* V2-Core-151 (J3): a reading screen. The scene leads; what I mean to do and what I can do follow; the notebook folds away.
     No external fonts or files: the page runs offline. */
  :root {
    --bg: #e9ece6;
    --page: #f4f5f1;
    --ink: #1e2420;
    --muted: #5b655d;
    --rule: #c9cfc6;
    --accent: #45604a;
    --accent-soft: #dfe7dd;
    --danger: #8a2f2f;
    --news-bg: #f1efe2;
    --news-rule: #d9d3b4;
    --news-ink: #7a6420;
    --serif: "Nanum Myeongjo", "Noto Serif KR", "Noto Serif CJK KR", "AppleMyungjo", "Batang", serif;
    --sans: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    --gap: 1rem;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121513; --page: #181c19; --ink: #d8ddd5; --muted: #8e998f; --rule: #2d342f; --accent: #93b293; --accent-soft: #223026; --danger: #d98a8a; --news-bg: #23211a; --news-rule: #4a4430; --news-ink: #c9ad5a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121513; --page: #181c19; --ink: #d8ddd5; --muted: #8e998f; --rule: #2d342f; --accent: #93b293; --accent-soft: #223026; --danger: #d98a8a; --news-bg: #23211a; --news-rule: #4a4430; --news-ink: #c9ad5a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    padding-block: 1.25rem 3rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 40rem; margin-inline: auto; display: grid; gap: var(--gap); }
  h1 { font-family: var(--serif); font-weight: 700; font-size: 1.5rem; letter-spacing: 0.04em; margin: 0; }
  h2 { font-size: 0.78rem; font-weight: 500; letter-spacing: 0.1em; color: var(--muted); margin: 0 0 0.4rem; }
  button {
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 0.55rem 0.8rem;
    cursor: pointer;
    min-height: 2.6rem;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  select, input { font: inherit; color: inherit; background: var(--page); border: 1px solid var(--rule); border-radius: 4px; padding: 0.45rem 0.6rem; }
  #error { background: var(--danger); color: var(--page); padding: 0.6rem 0.8rem; border-radius: 4px; margin: 0; }

  /* the menu */
  #menu { display: grid; gap: 1.25rem; padding-top: 1.5rem; }
  .lede { font-family: var(--serif); font-size: 1.05rem; line-height: 1.9; color: var(--muted); margin: 0; }
  .start { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  #newGameBtn { background: var(--accent); border-color: var(--accent); color: var(--page); }
  #slotList { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.25rem; }
  #slotList li { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }

  /* the game: three bands that never blur -- what happened (the page), what I mean to do (the strip), what I can do
     (the list) -- then the notebook. V2-Core-152 */
  #game:not([hidden]) { display: grid; gap: 0.9rem; }
  .band-label { font: 600 0.8rem/1 var(--sans); letter-spacing: 0.12em; color: var(--muted); margin: 0; }
  .page { background: var(--page); border: 1px solid var(--rule); border-radius: 6px; padding: 1.25rem clamp(1rem, 5vw, 2.25rem) 1.5rem; display: grid; gap: 1.1rem; }
  .where { display: flex; justify-content: space-between; gap: 0.5rem 0.75rem; flex-wrap: wrap; font-size: 0.82rem; color: var(--muted); padding-bottom: 0.75rem; border-bottom: 1px solid var(--rule); }
  #location { font-weight: 600; color: var(--ink); }
  #vitals { font-variant-numeric: tabular-nums; }
  #scene { font-family: var(--serif); font-size: 1.18rem; line-height: 1.9; display: grid; gap: 1em; min-width: 0; max-width: 34em; }
  #scene p { margin: 0; text-wrap: pretty; }
  /* what the step taught or gave me */
  #news { list-style: none; margin: 0; padding: 0.75rem 0.9rem; display: grid; gap: 0.45rem; background: var(--news-bg); border: 1px solid var(--news-rule); border-radius: 6px; }
  #news li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 0.6rem; }
  #news .tag { font: 600 0.72rem/1.6 var(--sans); letter-spacing: 0.06em; color: var(--page); background: var(--news-ink); border-radius: 3px; padding: 0 0.45rem; }
  #news li[data-kind="spent"] .tag, #news li[data-kind="hurt"] .tag { background: var(--muted); }
  #news li[data-kind="hurt"] .tag { background: var(--danger); }
  #news .what { font-family: var(--serif); font-size: 1.02rem; font-weight: 700; }
  #news .note { font-size: 0.82rem; color: var(--muted); }
  /* what I mean to do */
  #goal { background: var(--accent-soft); border-radius: 6px; padding: 0.8rem 1rem; display: grid; gap: 0.35rem; }
  #goalText { margin: 0; font-family: var(--serif); font-size: 1.05rem; line-height: 1.7; display: grid; gap: 0.25rem; }
  #goalText span[data-track="main"] { font-weight: 700; }
  #goalText span.side { color: var(--muted); font-size: 0.95rem; }
  #goal[data-changed="true"] .band-label::after { content: " · 새 목표"; color: var(--accent); font-weight: 700; }
  /* what I can do */
  .play { display: grid; gap: 1.1rem; }
  .doing { display: grid; gap: 0.6rem; }
  #doingLabel[hidden] { display: none; }
  #actions, #choiceOptions { display: grid; gap: 0.45rem; counter-reset: pick; }
  #actions button, #choiceOptions button {
    text-align: left; font-family: var(--serif); font-size: 1.02rem; line-height: 1.5;
    background: var(--page); padding: 0.7rem 0.9rem;
  }
  #actions button:not(:disabled)::before, #choiceOptions button:not(:disabled)::before {
    counter-increment: pick; content: counter(pick);
    font: 600 0.8rem/1.5rem var(--sans); color: var(--accent); min-width: 1.5rem; height: 1.5rem; text-align: center;
    border: 1px solid var(--accent); border-radius: 50%; flex: none;
  }
  #actions button:disabled, #choiceOptions button:disabled { background: transparent; border-style: dashed; padding-left: 3.1rem; font-size: 0.92rem; display: block; }
  /* V2-Core-153: what the choice asks -- time, cost, the check and its chance, what I have (✓) or lack (필요) */
  #actions button, #choiceOptions button { display: grid; grid-template-columns: auto 1fr; column-gap: 0.7rem; align-items: baseline; }
  #actions button[data-note]::after, #choiceOptions button[data-note]::after {
    content: attr(data-note); grid-column: 2; display: block; margin-top: 0.15rem;
    font: 0.8rem/1.4 var(--sans); color: var(--muted); letter-spacing: 0.01em;
  }
  #actions button:disabled[data-note]::after, #choiceOptions button:disabled[data-note]::after { color: var(--danger); }
  button[data-risk="likely"]::after, button[data-risk="sure"]::after { color: var(--accent) !important; }
  button[data-risk="hard"]::after, button[data-risk="desperate"]::after { color: var(--news-ink) !important; }
  #moves button[data-note]::after { content: " · " attr(data-note); color: var(--muted); font-size: 0.82rem; }
  #choice { display: grid; gap: 0.6rem; }
  /* V2-Core-155: something happening here -- its scene, then the way in */
  .encounter { display: grid; gap: 0.5rem; padding: 0.8rem 0.9rem 0.9rem; border: 1px solid var(--news-rule); background: var(--news-bg); border-radius: 6px; }
  .encounter > button { background: var(--page); }
  .encounter > p { margin: 0; font-family: var(--serif); font-size: 1rem; line-height: 1.8; }
  .encounter > p::before { content: "이곳에서 벌어지는 일"; display: block; font: 600 0.72rem/1.6 var(--sans); letter-spacing: 0.1em; color: var(--news-ink); }
  #choice[hidden], #menu[hidden], #game[hidden], #storySection[hidden], #news[hidden] { display: none; }
  .roads { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; padding-top: 0.2rem; }
  #moves { display: contents; }
  #moves button, .roads > button { font-size: 0.9rem; background: transparent; }
  #moves button::before { content: "→ "; color: var(--accent); }
  @media (prefers-reduced-motion: no-preference) {
    #news:not([hidden]) { animation: rise 0.35s ease-out; }
    #goal[data-changed="true"] { animation: glow 1.2s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes glow { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: 0 0 0 0 transparent; } }
  }

  /* the notebook */
  #notebook { border-top: 1px solid var(--rule); padding-top: 0.6rem; }
  #notebookBtn { border: none; padding: 0.25rem 0; min-height: 0; font-size: 0.9rem; color: var(--muted); letter-spacing: 0.04em; }
  #notebookBtn::before { content: "▸ "; }
  #notebookBtn[aria-expanded="true"]::before { content: "▾ "; }
  #notebookBtn::after { content: " · " attr(data-count); }
  #knowledge li[data-new] { font-weight: 700; color: var(--accent); }
  #notes[hidden] { display: none; }
  .notes { display: grid; gap: 1.1rem; padding-top: 0.9rem; font-size: 0.9rem; }
  #status p { margin: 0.1rem 0; }
  #knowledge, #story, #log { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.25rem; }
  #knowledge li[data-relevant] { font-weight: 600; }
  #knowledge li[data-stale] { opacity: 0.65; }
  #story li { padding-left: 1rem; }
  #story li.story-chapter { padding-left: 0; font-weight: 600; margin-top: 0.3rem; }
  #log { max-height: 16rem; overflow-y: auto; color: var(--muted); }
  #saveRow { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
  #saveSlotInput { flex: 1; min-width: 0; }
  @media (max-width: 420px) {
    #scene { font-size: 1.08rem; }
  }
</style>
</head>
<body>
<div class="wrap" id="app">
<h1>무명의 연대기</h1>
<p id="error" hidden></p>

<div id="menu">
  <p class="lede">이름 없는 이들이 남긴 일이 세계의 역사가 된다. 이름은 세계가 기억할 때 생긴다.</p>
  <section class="start">
    <label for="backgroundSelect">내가 누구였는지</label>
    <select id="backgroundSelect"></select>
    <button id="newGameBtn">새 게임</button>
  </section>
  <section>
    <h2>저장된 게임</h2>
    <ul id="slotList"></ul>
  </section>
</div>

<div id="game" hidden>
  <div class="page">
    <div class="where"><span id="location"></span><span id="vitals"></span></div>
    <article id="scene" aria-live="polite"></article>
    <ul id="news" hidden aria-live="polite"></ul>
  </div>
  <section id="goal" data-changed="false">
    <h2 class="band-label">지금 할 일</h2>
    <p id="goalText"></p>
  </section>
  <div class="play">
    <section id="choice" hidden>
      <h2 class="band-label" id="choiceTitle">무엇이라고 할까</h2>
      <div id="choiceOptions"></div>
    </section>
    <section class="doing" id="doing">
      <h2 class="band-label" id="doingLabel">무엇을 할까</h2>
      <div id="actions"></div>
      <div class="roads">
        <div id="moves"></div>
        <button id="waitBtn">잠시 기다린다 (30분)</button>
        <button id="waitDayBtn">하루를 보낸다</button>
      </div>
    </section>
    <section id="notebook">
      <button id="notebookBtn" type="button" aria-expanded="false" aria-controls="notes" data-count="아는 것 0">수첩 펼치기</button>
      <div class="notes" id="notes" hidden>
        <section>
          <h2>몸 상태와 가진 것</h2>
          <div id="status"></div>
        </section>
        <section id="storySection" hidden>
          <h2>이야기</h2>
          <ul id="story"></ul>
        </section>
        <section>
          <h2>아는 것</h2>
          <ul id="knowledge"></ul>
        </section>
        <section>
          <h2>기록</h2>
          <ul id="log"></ul>
        </section>
      </div>
    </section>
  </div>
  <section id="saveRow">
    <input id="saveSlotInput" type="text" placeholder="저장 이름" value="slot_1" aria-label="저장 이름">
    <button id="saveBtn">저장</button>
    <button id="backToMenuBtn">메뉴로</button>
  </section>
</div>
</div>

<script type="module" src="./ui/app.js"></script>
</body>
</html>
